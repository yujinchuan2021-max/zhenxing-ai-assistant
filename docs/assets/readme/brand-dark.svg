      .label { fill: #bdb1a1; font-size: 16px; font-weight: 400; }
      .number { fill: #f0ac70; font-size: 17px; font-weight: 600; }
      .step { fill: #f5f0e9; font-size: 23px; font-weight: 600; }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="438" rx="24" fill="#191714" stroke="#3e3830" stroke-width="2" />
  <rect x="64" y="44" width="52" height="4" rx="2" fill="#f0a75f" />
  <g transform="translate(64 70) scale(1.2)">
