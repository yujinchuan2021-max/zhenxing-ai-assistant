    <!-- 主题防闪烁：样式加载前先决定 data-theme（深色为默认） -->
    <!-- 正文字体同理：默认更纱黑体，只有选过 Noto / HarmonyOS 才换（选择只存本机浏览器） -->
    <!-- 界面语言同理：默认中文，只有手动切到 English 才换（同样只存本机浏览器） -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zxai-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.style.colorScheme = theme;
          var font = localStorage.getItem('zxai-font');
          document.documentElement.dataset.font =
            font === 'noto' || font === 'harmony' ? font : 'sarasa';
          var lang = localStorage.getItem('zxai-lang');
          var useEn = lang === 'en';
          document.documentElement.dataset.lang = useEn ? 'en' : 'zh';
          document.documentElement.lang = useEn ? 'en' : 'zh-CN';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.themeMode = 'system';
          document.documentElement.dataset.font = 'sarasa';
        }
      })();
    </script>
